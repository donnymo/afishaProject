<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Концерты, спектакли, выставки и лекции в Москве" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <title>Афиша Москвы</title>
    <script>
      // Тёмная тема по настройке системы. Скрипт выполняется до отрисовки, поэтому тема не мигает.
      (function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          document.documentElement.classList.toggle('dark', media.matches);
        };
        apply();
        media.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
