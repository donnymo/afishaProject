services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: afisha
      POSTGRES_DB: afisha
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afisha -d afisha']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
